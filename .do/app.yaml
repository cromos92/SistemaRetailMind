# =============================================================================
# Digital Ocean App Platform — spec de referencia para RetailMind
# =============================================================================
# IMPORTANTE: esto es una PLANTILLA para mergear con el spec real de tu app.
# Tu app ya existe (dominio retail-ap-mh3y2.ondigitalocean.app), así que NO
# apliques este archivo tal cual: bájate el spec actual, agrégale el componente
# `worker: scheduler` (y las env vars nuevas), y vuelve a aplicarlo.
#
#   doctl apps list                                  # encuentra el APP_ID
#   doctl apps spec get <APP_ID> > .do/app.actual.yaml
#   # ...copia el bloque `workers:` y las envs nuevas a .do/app.actual.yaml...
#   doctl apps update <APP_ID> --spec .do/app.actual.yaml
#
# La clave es el componente WORKER: App Platform no tiene cron nativo, así que un
# worker de larga vida (run_scheduler) es la forma soportada de correr la
# expiración periódica de reservas, vales y puntos. Reusa la MISMA imagen Docker
# que la web; solo cambia el run_command.
# =============================================================================

name: retailmind
region: nyc

# --- Servicio web (lo que ya tienes; mostrado para referencia) ---
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    # El Dockerfile ya hace WORKDIR /app/retailmind y arranca gunicorn; este
    # run_command es equivalente al CMD del Dockerfile (explícito por claridad).
    run_command: gunicorn retailmind.wsgi --bind 0.0.0.0:8000 --log-file -
    health_check:
      http_path: /
    envs:
      - key: DEBUG
        value: "False"
      - key: TZ
        value: America/Santiago
      # DATABASE_URL: si tienes una BD gestionada en la misma app, enlázala así:
      #   - key: DATABASE_URL
      #     value: ${db.DATABASE_URL}
      # SECRET_KEY, REDIS_URL, EMAIL_*, ALLCONNECTED_*, etc. → como ya las tienes.

# --- Worker: scheduler de tareas periódicas (NUEVO) ---
workers:
  - name: scheduler
    dockerfile_path: Dockerfile
    source_dir: /
    # UNA sola instancia: el bucle es único, no se escala horizontalmente.
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: python manage.py run_scheduler
    envs:
      - key: DEBUG
        value: "False"
      - key: TZ
        value: America/Santiago
      - key: SCHEDULER_INTERVALO_SEG
        value: "300"          # cada 5 min: expira reservas y vales vencidos
      - key: SCHEDULER_HORA_PUNTOS
        value: "4"            # 04:00 Chile: expira lotes de puntos vencidos (diario)
      # El worker necesita las MISMAS credenciales de BD/Redis que la web:
      #   - key: DATABASE_URL
      #     value: ${db.DATABASE_URL}
      #   - key: REDIS_URL
      #     value: ${redis.DATABASE_URL}
      #   - key: SECRET_KEY
      #     scope: RUN_TIME
      #     type: SECRET

# =============================================================================
# ALTERNATIVA sin worker (más barata): disparador HTTP + DO Functions agendado.
# En vez del worker, agenda un trigger que haga POST al endpoint protegido:
#
#   POST https://retail-ap-mh3y2.ondigitalocean.app/app/api/cron/tareas/
#        Header: X-Cron-Key: <CRON_TRIGGER_KEY>
#   (agrega ?incluir_puntos=1 en UNA corrida diaria para expirar puntos)
#
# Requiere setear la env var CRON_TRIGGER_KEY en el servicio `web`.
# Ver DESPLIEGUE_DIGITALOCEAN.md para el paso a paso de DO Functions.
# =============================================================================
