<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="400" fill="#1A1A2E"/>
  
  <!-- Icono: Nodos conectados formando una N abstracta -->
  <g transform="translate(100, 60)">
    <!-- Nodo superior izquierdo -->
    <circle cx="40" cy="40" r="24" fill="#0066FF"/>
    <circle cx="40" cy="40" r="12" fill="#1A1A2E"/>
    
    <!-- Nodo superior derecho -->
    <circle cx="160" cy="40" r="24" fill="#00D4AA"/>
    <circle cx="160" cy="40" r="12" fill="#1A1A2E"/>
    
    <!-- Nodo inferior izquierdo -->
    <circle cx="40" cy="160" r="24" fill="#00D4AA"/>
    <circle cx="40" cy="160" r="12" fill="#1A1A2E"/>
    
    <!-- Nodo inferior derecho -->
    <circle cx="160" cy="160" r="24" fill="#0066FF"/>
    <circle cx="160" cy="160" r="12" fill="#1A1A2E"/>
    
    <!-- Conexiones (líneas) -->
    <!-- Línea vertical izquierda -->
    <line x1="40" y1="64" x2="40" y2="136" stroke="#0066FF" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Línea diagonal (la N) -->
    <line x1="52" y1="52" x2="148" y2="148" stroke="#00D4AA" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Línea vertical derecha -->
    <line x1="160" y1="64" x2="160" y2="136" stroke="#0066FF" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Línea horizontal superior -->
    <line x1="64" y1="40" x2="136" y2="40" stroke="#00D4AA" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
    
    <!-- Línea horizontal inferior -->
    <line x1="64" y1="160" x2="136" y2="160" stroke="#0066FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
  </g>
  
  <!-- Texto NEXO -->
  <text x="200" y="310" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">
    NEXO
  </text>
  
  <!-- Subtítulo -->
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="18" fill="#8A8A9A" text-anchor="middle" letter-spacing="4">
    RETAIL MANAGEMENT
  </text>
</svg>
