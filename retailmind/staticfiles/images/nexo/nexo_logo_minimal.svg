<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="200" fill="#1A1A2E"/>
  
  <!-- Texto NEX con la X especial y O -->
  <!-- N -->
  <text x="50" y="130" font-family="Arial Black, Arial, sans-serif" font-size="100" font-weight="900" fill="#FFFFFF">
    NE
  </text>
  
  <!-- X especial con gradiente -->
  <defs>
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- X con color gradiente -->
  <text x="185" y="130" font-family="Arial Black, Arial, sans-serif" font-size="100" font-weight="900" fill="url(#xGradient)">
    X
  </text>
  
  <!-- O -->
  <text x="260" y="130" font-family="Arial Black, Arial, sans-serif" font-size="100" font-weight="900" fill="#FFFFFF">
    O
  </text>
  
  <!-- Punto decorativo sobre la X -->
  <circle cx="220" cy="45" r="8" fill="#00D4AA"/>
  
  <!-- Línea decorativa bajo el texto -->
  <line x1="50" y1="150" x2="350" y2="150" stroke="#0066FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="150" x2="260" y2="150" stroke="#00D4AA" stroke-width="4" stroke-linecap="round"/>
</svg>
