{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - NEXO</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/icons.min.css' %}" rel="stylesheet">
    <style>
        :root {
            --nexo-primary: #0066FF;
            --nexo-primary-dark: #0052CC;
            --nexo-error: #FF4D4D;
            --nexo-gray-100: #F5F5F7;
            --nexo-gray-300: #D1D1D9;
            --nexo-gray-500: #8A8A9A;
            --nexo-gray-700: #4A4A5A;
            --nexo-gray-900: #1A1A2E;
            --nexo-white: #FFFFFF;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, var(--nexo-gray-100) 0%, #E0E4E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .error-container {
            max-width: 450px;
            width: 100%;
        }
        
        .error-card {
            background: var(--nexo-white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(26, 26, 46, 0.15);
            text-align: center;
        }
        
        .error-header {
            background: linear-gradient(135deg, var(--nexo-error) 0%, #E63939 100%);
            padding: 2.5rem 2rem;
        }
        
        .error-icon {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        
        .error-icon i {
            font-size: 3rem;
            color: var(--nexo-white);
        }
        
        .error-body {
            padding: 2rem;
        }
        
        .error-body h1 {
            color: var(--nexo-gray-900);
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
        }
        
        .error-body p {
            color: var(--nexo-gray-500);
            margin: 0 0 1.5rem;
        }
        
        .error-detail {
            background: rgba(255, 77, 77, 0.1);
            border-left: 4px solid var(--nexo-error);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: left;
            color: var(--nexo-gray-700);
            font-size: 0.9rem;
        }
        
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--nexo-primary) 0%, var(--nexo-primary-dark) 100%);
            border: none;
            border-radius: 8px;
            color: var(--nexo-white);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
            color: var(--nexo-white);
        }
        
        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: transparent;
            border: 2px solid var(--nexo-gray-300);
            border-radius: 8px;
            color: var(--nexo-gray-700);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.15s ease;
            margin-right: 1rem;
        }
        
        .btn-outline:hover {
            border-color: var(--nexo-primary);
            color: var(--nexo-primary);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo span {
            font-size: 2rem;
            font-weight: 700;
            color: var(--nexo-primary);
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="logo">
            <span>NEXO</span>
        </div>
        
        <div class="error-card">
            <div class="error-header">
                <div class="error-icon">
                    <i class="ri-error-warning-line"></i>
                </div>
            </div>
            
            <div class="error-body">
                <h1>{{ error }}</h1>
                <p>No se pudo procesar tu solicitud</p>
                
                {% if detalle %}
                <div class="error-detail">
                    <i class="ri-information-line me-1"></i>
                    {{ detalle }}
                </div>
                {% endif %}
                
                <div class="buttons">
                    <a href="{% url 'login' %}" class="btn-outline">
                        <i class="ri-login-box-line"></i>
                        Iniciar Sesión
                    </a>
                    <a href="{% url 'verHome' %}" class="btn-back">
                        <i class="ri-home-line"></i>
                        Ir al Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
