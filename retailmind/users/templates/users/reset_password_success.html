{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Actualizada - NEXO</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/icons.min.css' %}" rel="stylesheet">
    <style>
        :root {
            --nexo-primary: #0066FF;
            --nexo-primary-dark: #0052CC;
            --nexo-accent: #00D4AA;
            --nexo-success: #00D4AA;
            --nexo-gray-100: #F5F5F7;
            --nexo-gray-500: #8A8A9A;
            --nexo-gray-700: #4A4A5A;
            --nexo-gray-900: #1A1A2E;
            --nexo-white: #FFFFFF;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, var(--nexo-gray-100) 0%, #E0E4E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .success-container {
            max-width: 450px;
            width: 100%;
        }
        
        .success-card {
            background: var(--nexo-white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(26, 26, 46, 0.15);
            text-align: center;
        }
        
        .success-header {
            background: linear-gradient(135deg, var(--nexo-success) 0%, #00B38A 100%);
            padding: 2.5rem 2rem;
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            animation: success-pulse 2s infinite;
        }
        
        @keyframes success-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .success-icon i {
            font-size: 3rem;
            color: var(--nexo-white);
        }
        
        .success-body {
            padding: 2rem;
        }
        
        .success-body h1 {
            color: var(--nexo-gray-900);
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
        }
        
        .success-body p {
            color: var(--nexo-gray-500);
            margin: 0 0 2rem;
        }
        
        .btn-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--nexo-primary) 0%, var(--nexo-primary-dark) 100%);
            border: none;
            border-radius: 8px;
            color: var(--nexo-white);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
            color: var(--nexo-white);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo span {
            font-size: 2rem;
            font-weight: 700;
            color: var(--nexo-primary);
        }
        
        .user-greeting {
            background: var(--nexo-gray-100);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .user-greeting strong {
            color: var(--nexo-gray-900);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="logo">
            <span>NEXO</span>
        </div>
        
        <div class="success-card">
            <div class="success-header">
                <div class="success-icon">
                    <i class="ri-check-line"></i>
                </div>
            </div>
            
            <div class="success-body">
                <h1>Contraseña Actualizada</h1>
                <p>Tu contraseña ha sido cambiada exitosamente</p>
                
                {% if usuario %}
                <div class="user-greeting">
                    <i class="ri-user-line me-1"></i>
                    <strong>{{ usuario.get_full_name }}</strong>
                </div>
                {% endif %}
                
                <p class="text-muted small">
                    Por seguridad, todas tus sesiones anteriores han sido cerradas.
                </p>
                
                <a href="{% url 'login' %}" class="btn-login">
                    <i class="ri-login-box-line"></i>
                    Iniciar Sesión
                </a>
            </div>
        </div>
    </div>
</body>
</html>
