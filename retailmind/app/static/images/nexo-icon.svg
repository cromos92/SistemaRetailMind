<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con esquinas redondeadas (estilo app) -->
  <rect width="200" height="200" rx="40" fill="#1A1A2E"/>
  
  <!-- Icono: Nodos conectados -->
  <g transform="translate(30, 30)">
    <!-- Nodo superior izquierdo -->
    <circle cx="35" cy="35" r="20" fill="#0066FF"/>
    <circle cx="35" cy="35" r="10" fill="#1A1A2E"/>
    
    <!-- Nodo superior derecho -->
    <circle cx="105" cy="35" r="20" fill="#00D4AA"/>
    <circle cx="105" cy="35" r="10" fill="#1A1A2E"/>
    
    <!-- Nodo inferior izquierdo -->
    <circle cx="35" cy="105" r="20" fill="#00D4AA"/>
    <circle cx="35" cy="105" r="10" fill="#1A1A2E"/>
    
    <!-- Nodo inferior derecho -->
    <circle cx="105" cy="105" r="20" fill="#0066FF"/>
    <circle cx="105" cy="105" r="10" fill="#1A1A2E"/>
    
    <!-- Conexiones -->
    <line x1="35" y1="55" x2="35" y2="85" stroke="#0066FF" stroke-width="5" stroke-linecap="round"/>
    <line x1="47" y1="47" x2="93" y2="93" stroke="#00D4AA" stroke-width="5" stroke-linecap="round"/>
    <line x1="105" y1="55" x2="105" y2="85" stroke="#0066FF" stroke-width="5" stroke-linecap="round"/>
    <line x1="55" y1="35" x2="85" y2="35" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
    <line x1="55" y1="105" x2="85" y2="105" stroke="#0066FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  </g>
</svg>
