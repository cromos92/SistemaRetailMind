<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icono pequeño -->
  <g transform="translate(5, 10)">
    <!-- Nodo superior izquierdo -->
    <circle cx="15" cy="15" r="10" fill="#0066FF"/>
    <circle cx="15" cy="15" r="5" fill="#1A1A2E"/>
    
    <!-- Nodo superior derecho -->
    <circle cx="45" cy="15" r="10" fill="#00D4AA"/>
    <circle cx="45" cy="15" r="5" fill="#1A1A2E"/>
    
    <!-- Nodo inferior izquierdo -->
    <circle cx="15" cy="45" r="10" fill="#00D4AA"/>
    <circle cx="15" cy="45" r="5" fill="#1A1A2E"/>
    
    <!-- Nodo inferior derecho -->
    <circle cx="45" cy="45" r="10" fill="#0066FF"/>
    <circle cx="45" cy="45" r="5" fill="#1A1A2E"/>
    
    <!-- Conexiones -->
    <line x1="15" y1="25" x2="15" y2="35" stroke="#0066FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="21" y1="21" x2="39" y2="39" stroke="#00D4AA" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="25" x2="45" y2="35" stroke="#0066FF" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Texto NEXO -->
  <text x="85" y="52" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" fill="#1A1A2E" letter-spacing="4">
    NEXO
  </text>
</svg>
