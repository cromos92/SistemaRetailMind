<!-- ========== MODAL: AGENTE "CARGAR DESDE FACTURA" ==========
     Chat con el agente de carga: se adjunta la factura del proveedor en PDF,
     el agente la lee (Claude, en segundo plano), muestra una vista previa
     editable por factura y carga por el mismo camino que Crear Producto
     Manual. Endpoints en views_modulo_carga_factura.py; lógica en
     static/js/carga_factura.js. Se incluye desde verGestionProductos.html. -->
<style>
    .cf-dialog { max-width: min(1440px, 96vw); }
    .cf-dialog .modal-content { height: 92vh; }
    .cf-body { background: #f3f6f9; }
    .cf-chat { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; min-height: 100%; }
    .cf-msg { display: flex; gap: 10px; max-width: 80%; }
    .cf-msg.cf-usuario { align-self: flex-end; flex-direction: row-reverse; }
    .cf-avatar {
        width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--grad-primary); color: #fff; font-size: 1rem;
    }
    .cf-usuario .cf-avatar { background: var(--grad-success); }
    .cf-burbuja {
        background: #fff; border-radius: 14px; padding: 10px 14px; font-size: .9rem;
        box-shadow: 0 2px 8px rgba(20,20,60,.06); white-space: pre-line; overflow-wrap: anywhere;
    }
    .cf-usuario .cf-burbuja { background: #405189; color: #fff; }
    .cf-usuario .cf-burbuja .cf-muted { color: rgba(255,255,255,.75); }
    .cf-error .cf-burbuja { border-left: 4px solid #f06548; }
    .cf-hora { font-size: .7rem; color: #8a93a6; margin-top: 4px; }
    .cf-usuario .cf-hora { text-align: right; }
    .cf-pasos { padding-left: 18px; margin: 6px 0; white-space: normal; }
    .cf-pasos li { margin-bottom: 4px; }
    .cf-etiqueta { font-size: .68rem; text-transform: uppercase; letter-spacing: .4px; opacity: .8; margin-bottom: 2px; }

    /* Píldora de estado en el encabezado */
    .cf-pill {
        display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 600;
        border-radius: var(--nexo-radius-full, 9999px); padding: 3px 10px; white-space: nowrap;
        background: rgba(255,255,255,.18); color: #fff;
    }
    .cf-pill-run { background: rgba(255,255,255,.28); }
    .cf-pill-ok { background: var(--nexo-accent, #00D4AA); color: #0b3b33; }
    .cf-pill-error { background: var(--nexo-error, #FF4D4D); }
    .cf-pill-muted { opacity: .85; }

    /* Hitos del proceso (factura enviada, lectura terminada, carga, problema) */
    .cf-evento {
        align-self: center; display: flex; gap: 10px; max-width: 80%; background: #fff;
        border: 1px solid #e5e9f0; border-radius: 12px; padding: 8px 12px; font-size: .82rem;
        box-shadow: var(--nexo-shadow-sm, 0 1px 2px rgba(26,26,46,.05));
    }
    .cf-evento-icono {
        width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; background: #eef2ff; color: #405189;
        display: flex; align-items: center; justify-content: center;
    }
    .cf-evento-ok .cf-evento-icono { background: #e0f2f1; color: #0a7d6d; }
    .cf-evento-error { border-color: #f6c9c0; }
    .cf-evento-error .cf-evento-icono { background: #fde2dd; color: #c0392b; }
    .cf-evento-titulo { font-weight: 600; color: var(--nexo-text-primary, #1A1A2E); }
    .cf-evento-texto { white-space: pre-line; color: var(--nexo-text-secondary, #4A4A5A); margin-top: 2px; }

    /* Tarjeta «Factura enviada a leer» (burbuja de la persona) */
    .cf-envio { display: grid; gap: 4px; min-width: 260px; white-space: normal; }
    .cf-envio-titulo { font-weight: 600; margin-bottom: 4px; }
    .cf-envio-fila { display: grid; grid-template-columns: 18px 92px 1fr; gap: 6px; align-items: baseline; font-size: .82rem; }
    .cf-envio-fila span { opacity: .8; }
    .cf-envio-fila b { font-weight: 600; overflow-wrap: anywhere; }

    /* Debajo de una respuesta: qué aplicó / qué no existe / qué falló */
    .cf-aplicado { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5e9f0; white-space: normal; }
    .cf-aplicado-titulo { font-size: .76rem; font-weight: 600; color: #0a7d6d; margin-bottom: 4px; }
    .cf-aplicado-no .cf-aplicado-titulo { color: #b7791f; }

    /* Burbuja de progreso: spinner + texto + reloj */
    .cf-typing .cf-burbuja { min-width: 280px; }
    .cf-progreso { display: flex; align-items: center; gap: 10px; }
    .cf-progreso .spinner-border { color: #405189; flex-shrink: 0; }
    .cf-progreso-texto { font-weight: 600; color: #405189; }
    .cf-crono { font-variant-numeric: tabular-nums; font-size: .74rem; color: #8a93a6; padding-left: 10px; }

    /* Tarjeta de vista previa de una factura (ocupa todo el ancho del chat) */
    .cf-card { align-self: stretch; max-width: 100%; }
    .cf-card .cf-burbuja { width: 100%; white-space: normal; padding: 0; overflow: hidden; }
    .cf-card-head {
        background: var(--grad-module); color: #fff; padding: 10px 16px;
        display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
    }
    .cf-card-head .form-control, .cf-card-head .form-select {
        font-size: .8rem; padding: 2px 6px; height: auto; width: auto; display: inline-block;
    }
    .cf-card-body { padding: 12px 16px; }
    .cf-resumen { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: #495057; margin-bottom: 8px; }
    .cf-tabla { margin-bottom: 0; }
    .cf-tabla th { font-size: .7rem; text-transform: uppercase; letter-spacing: .3px; color: #6b7280; white-space: nowrap; }
    .cf-tabla td { font-size: .83rem; vertical-align: top; }
    .cf-tabla input.form-control, .cf-tabla select.form-select, .cf-tabla textarea.form-control {
        font-size: .78rem; padding: 2px 6px; min-width: 84px;
    }
    .cf-tabla select[multiple] { min-height: 52px; }
    .cf-tabla textarea.form-control { min-width: 110px; font-family: monospace; }
    .cf-tabla tr.cf-detalle td { border-top: 0; padding-top: 0; }
    .cf-tabla tr.cf-omitida td:not(.cf-col-decision) { opacity: .45; }
    .cf-chip { display: inline-block; background: #eef2ff; color: #364574; border-radius: 6px; padding: 1px 6px; font-size: .74rem; margin: 1px; white-space: nowrap; }
    .cf-chip.nueva { background: #e0f2f1; color: #0a7d6d; }
    .cf-chip.no { background: #fff3cd; color: #9a6b00; }
    .cf-nota { font-size: .76rem; margin: 0; }
    .cf-nota.aviso { color: #b7791f; }
    .cf-nota.error { color: #d9534f; }
    .cf-nota.ok { color: #0a7d6d; }
    .cf-estado { font-size: .68rem; font-weight: 700; border-radius: 6px; padding: 2px 6px; white-space: nowrap; display: inline-block; }
    .cf-estado.NUEVO { background: #e0f2f1; color: #0a7d6d; }
    .cf-estado.EXISTE, .cf-estado.EXISTE_OTRAS { background: #e3f2fd; color: #1e7ab8; }
    .cf-estado.YA_CARGADO, .cf-estado.PARCIAL, .cf-estado.CARGANDO { background: #fff3cd; color: #9a6b00; }
    .cf-estado.DUPLICADAS, .cf-estado.ERROR, .cf-estado.FALLO { background: #fde2dd; color: #c0392b; }
    .cf-estado.OMITIDA, .cf-estado.SALTADA, .cf-estado.PENDIENTE { background: #eceff3; color: #6b7280; }
    .cf-estado.CARGADA, .cf-estado.OK { background: #d1f2eb; color: #0a7d6d; }
    .cf-muted { font-size: .74rem; color: #8a93a6; }
    .cf-card-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #f8f9fb; border-top: 1px solid #e5e9f0; }
    .cf-card-foot .btn { border-radius: 10px; font-size: .82rem; }

    /* Compositor: adjunto + parámetros arriba, caja de texto + botones abajo, ayuda al pie */
    .cf-composer { display: block; background: #fff; border-top: 1px solid #e5e9f0; padding: 10px 16px 12px; }
    .cf-adjuntos { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }
    .cf-archivo {
        display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
        background: #eef2ff; color: #364574; border-radius: 10px; padding: 4px 8px 4px 10px; font-size: .82rem;
    }
    .cf-archivo .bi-file-earmark-pdf { color: #d9534f; }
    .cf-archivo-nombre { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .cf-archivo-quitar { border: 0; background: transparent; color: #6b7280; padding: 0 2px; line-height: 1; }
    .cf-archivo-quitar:hover { color: #c0392b; }
    .cf-param { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: .78rem; color: #6b7280; }
    .cf-param .form-select, .cf-param .form-control { width: auto; font-size: .82rem; }
    .cf-param #cfMarca { max-width: 170px; }
    .cf-entrada { display: flex; gap: 8px; align-items: flex-end; }
    .cf-entrada textarea { resize: none; border-radius: 12px; font-size: .9rem; line-height: 1.4; max-height: 120px; }
    .cf-entrada .btn { border-radius: 10px; white-space: nowrap; }
    .cf-btn-icono { width: 42px; height: 38px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .cf-ayuda { font-size: .74rem; color: #8a93a6; margin-top: 6px; min-height: 1em; }

    @media (max-width: 767.98px) {
        .cf-msg, .cf-evento { max-width: 96%; }
        .cf-chat { padding: 12px; }
        .cf-dialog .modal-content { height: 96vh; }
        .cf-envio { min-width: 0; }
        .cf-envio-fila { grid-template-columns: 18px 76px 1fr; }
        .cf-archivo-nombre { max-width: 150px; }
        .cf-typing .cf-burbuja { min-width: 0; }
    }
</style>

<script>
    // Bodega activa de la sesión: el compositor la deja preseleccionada.
    window.SUCURSAL_ACTUAL_ID = {{ request.session.idSucursalActual|default:"null" }};
</script>
<div class="modal fade" id="modalCargaFactura" tabindex="-1" aria-labelledby="modalCargaFacturaLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable cf-dialog">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header modal-header-primary text-white">
                <div class="d-flex align-items-center gap-2">
                    <div class="modal-header-icon">
                        <i class="bi bi-robot fs-5"></i>
                    </div>
                    <div>
                        <h5 class="modal-title text-white mb-0" id="modalCargaFacturaLabel">Cargar desde factura</h5>
                        <small class="modal-header-subtitle">Adjunta la factura del proveedor: la leo, te muestro qué crearía y cargas con un clic</small>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
                    <span id="cfEstadoPill" class="cf-pill cf-pill-muted">Sin carga abierta</span>
                    <select id="cfRecientes" class="form-select form-select-sm" style="max-width: 320px;" title="Cargas recientes">
                        <option value="">Cargas recientes…</option>
                    </select>
                    <button type="button" class="btn btn-sm btn-light" id="cfBtnNueva" title="Nueva carga">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
            </div>

            <div class="modal-body p-0 cf-body">
                <div id="cfChat" class="cf-chat"></div>
            </div>

            <div class="modal-footer cf-composer">
                <!-- Fila 1: el PDF adjunto (como ficha, con tamaño y «quitar») y los parámetros de la lectura -->
                <div class="cf-adjuntos">
                    <input type="file" id="cfArchivo" accept="application/pdf,.pdf" class="d-none">
                    <button type="button" class="btn btn-outline-primary btn-sm" id="cfBtnAdjuntar">
                        <i class="bi bi-paperclip me-1"></i>Adjuntar PDF
                    </button>
                    <span id="cfArchivoChip" class="cf-archivo d-none">
                        <i class="bi bi-file-earmark-pdf"></i>
                        <span id="cfNombreArchivo" class="cf-archivo-nombre"></span>
                        <small id="cfTamanoArchivo" class="cf-muted"></small>
                        <button type="button" class="cf-archivo-quitar" id="cfQuitarArchivo" title="Quitar el archivo"><i class="bi bi-x-lg"></i></button>
                    </span>
                    <label class="cf-param"><span>Bodega</span>
                        <select id="cfSucursal" class="form-select form-select-sm" title="Bodega donde entra la mercadería"></select>
                    </label>
                    <label class="cf-param"><span>Marca</span>
                        <input id="cfMarca" list="cfMarcas" class="form-control form-control-sm" placeholder="la detecta el lector" autocomplete="off">
                        <datalist id="cfMarcas"></datalist>
                    </label>
                    <label class="cf-param"><span>Lecturas</span>
                        <select id="cfLecturas" class="form-select form-select-sm" title="Lecturas independientes que se comparan entre sí">
                            <option value="2">2 (verifica)</option>
                            <option value="1">1 (rápida)</option>
                        </select>
                    </label>
                </div>
                <!-- Fila 2: escribirle al agente (con vista previa corrige/pregunta; antes de leer, son
                     indicaciones para el lector) y enviar el PDF -->
                <div class="cf-entrada">
                    <textarea id="cfTexto" class="form-control" rows="1" autocomplete="off"
                              placeholder="Indicaciones para leer la factura (opcional)"></textarea>
                    <button type="button" class="btn btn-primary cf-btn-icono" id="cfBtnHablar" title="Enviar mensaje (Enter)">
                        <i class="bi bi-send"></i>
                    </button>
                    <button type="button" class="btn btn-success" id="cfBtnEnviar" title="Sube el PDF y empieza la lectura">
                        <i class="bi bi-cloud-arrow-up me-1"></i>Enviar PDF
                    </button>
                </div>
                <div id="cfAyuda" class="cf-ayuda">Adjunta el PDF de la factura para empezar.</div>
            </div>
        </div>
    </div>
</div>
