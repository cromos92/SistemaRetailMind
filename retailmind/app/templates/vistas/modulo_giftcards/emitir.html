{% load static %}

{% include '../../layout/header.html' %}
{% include '../../layout/menu.html' %}
{% csrf_token %}

<style>
    .page-content { background:#fff !important; min-height: calc(100vh - 70px); }
    .card.shadow { border:none; border-radius:16px; overflow:hidden; box-shadow:0 4px 20px rgba(64,81,137,.1); }
    .module-header {
        background: linear-gradient(135deg,#405189 0%,#0ab39c 100%); color:white; padding:16px 24px;
        display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    }
    .module-header-left { display:flex; align-items:center; gap:14px; }
    .module-header-icon { width:48px; height:48px; background:rgba(255,255,255,.2); border-radius:12px;
        display:flex; align-items:center; justify-content:center; font-size:24px; }
    .module-header-info h5 { margin:0; font-size:18px; font-weight:600; color:white; }
    .gc-preview {
        background: linear-gradient(135deg,#1A1A2E 0%,#0066FF 100%); color:white; border-radius:16px;
        padding:28px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.2);
    }
    .gc-preview .codigo { font-family: monospace; font-size:22px; letter-spacing:3px; font-weight:700; margin-top:10px; }
    .gc-preview .monto { font-size:32px; font-weight:800; }
</style>

<div class="page-content">
    <div class="container-fluid">
        <div class="card shadow">
            <div class="module-header">
                <div class="module-header-left">
                    <div class="module-header-icon"><i class="ri-add-circle-line"></i></div>
                    <div class="module-header-info"><h5>Emitir Gift Card</h5></div>
                </div>
                <div class="module-header-actions">
                    <a href="{% url 'modulo_giftcards' %}" class="btn btn-light"><i class="ri-arrow-left-line"></i> Volver</a>
                </div>
            </div>

            <div class="card-body">
                <div class="row">
                    <div class="col-md-7">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Monto inicial *</label>
                            <input type="number" id="em-monto" class="form-control form-control-lg" min="1" placeholder="$ 0"
                                oninput="actualizarPreview()">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">RUT cliente (opcional)</label>
                                <div class="input-group">
                                    <input type="text" id="em-rut" class="form-control" placeholder="12345678-9">
                                    <button class="btn btn-outline-secondary" onclick="buscarCliente()"><i class="ri-search-line"></i></button>
                                </div>
                                <small class="text-muted" id="em-cliente-nombre"></small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Vencimiento (opcional)</label>
                                <input type="date" id="em-vencimiento" class="form-control">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">PIN (opcional)</label>
                                <input type="text" id="em-pin" class="form-control" maxlength="8" placeholder="Sin PIN">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Observaciones</label>
                            <textarea id="em-obs" class="form-control" rows="2"></textarea>
                        </div>
                        <button class="btn btn-success btn-lg" onclick="emitir()" id="btn-emitir">
                            <i class="ri-gift-line"></i> Emitir Gift Card
                        </button>
                    </div>
                    <div class="col-md-5">
                        <div class="gc-preview">
                            <div><i class="ri-gift-line" style="font-size:32px;"></i></div>
                            <div class="mt-2" style="opacity:.8;">GIFT CARD</div>
                            <div class="monto" id="pv-monto">$0</div>
                            <div class="codigo" id="pv-codigo">GC-••••-••••-••••</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const URLS_EM = {
    emitir: "{% url 'api_emitir_giftcard' %}",
    buscarCliente: "{% url 'api_buscar_cliente_requerimiento' %}",
};
let CLIENTE_ID = null;
function csrf() { return document.querySelector('[name=csrfmiddlewaretoken]').value; }
function fmt(n) { return '$' + (n||0).toLocaleString('es-CL'); }

function actualizarPreview() {
    const m = parseInt(document.getElementById('em-monto').value || 0);
    document.getElementById('pv-monto').textContent = fmt(m);
}

function buscarCliente() {
    const rut = document.getElementById('em-rut').value.trim();
    if (!rut) return;
    fetch(`${URLS_EM.buscarCliente}?rut=${encodeURIComponent(rut)}`).then(r=>r.json()).then(d=>{
        if (d.success && d.cliente) {
            CLIENTE_ID = d.cliente_id || null;
            document.getElementById('em-cliente-nombre').textContent = '✓ ' + (d.cliente.nombre || '');
        } else {
            CLIENTE_ID = null;
            document.getElementById('em-cliente-nombre').textContent = 'Cliente no encontrado (se emite sin titular)';
        }
    });
}

function emitir() {
    const monto = parseInt(document.getElementById('em-monto').value || 0);
    if (!monto || monto <= 0) { Swal.fire('Atención', 'Ingresa un monto válido.', 'warning'); return; }
    const payload = {
        monto,
        cliente_id: CLIENTE_ID,
        fecha_vencimiento: document.getElementById('em-vencimiento').value || null,
        pin: document.getElementById('em-pin').value.trim() || null,
        observaciones: document.getElementById('em-obs').value.trim(),
    };
    document.getElementById('btn-emitir').disabled = true;
    fetch(URLS_EM.emitir, {method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
        body: JSON.stringify(payload)}).then(r=>r.json()).then(d=>{
        document.getElementById('btn-emitir').disabled = false;
        if (d.success) {
            document.getElementById('pv-codigo').textContent = d.giftcard.codigo;
            Swal.fire({
                icon:'success', title:'Gift Card emitida',
                html:`<strong class="gc-codigo" style="font-size:20px;">${d.giftcard.codigo}</strong><br>Saldo: ${fmt(d.giftcard.saldo_actual)}`,
                confirmButtonText:'Listo'
            }).then(()=> window.location.href = `/app/giftcards/${d.giftcard.id}/`);
        } else {
            Swal.fire('Error', d.error, 'error');
        }
    });
}
</script>

{% include '../../layout/footer.html' %}
