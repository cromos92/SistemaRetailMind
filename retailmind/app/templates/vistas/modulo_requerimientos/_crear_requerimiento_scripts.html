<!-- Select2 lo carga layout/footer.html DESPUÉS de jQuery. Cargarlo acá lanzaba
     "jQuery is not defined" en consola (este parcial se incluye antes del footer). -->

<script>
let contadorFotosAdicionales = 0;
let maxFotos = 5;
let tiposFotoActuales = [];
let documentoEncontrado = null;
let productosDocumento = [];
let tipoSeleccionado = '';

// ========== ASISTENTE POR PASOS ==========
let pasoActual = 1;
const TOTAL_PASOS = 3;

const AYUDA_PASO = {
    1: 'Elige qué pasó con el producto',
    2: 'Identifica el producto reclamado',
    3: 'Adjunta la evidencia y describe el problema',
};

function irAPaso(destino) {
    if (destino < 1 || destino > TOTAL_PASOS) return;

    // Solo se valida al AVANZAR: volver atrás nunca debe bloquearse.
    if (destino > pasoActual && !validarPaso(pasoActual)) return;

    pasoActual = destino;
    document.querySelectorAll('.req-paso').forEach(p => p.classList.remove('activo'));
    document.getElementById(`req-paso-${destino}`).classList.add('activo');

    document.querySelectorAll('.req-step').forEach(s => {
        const n = parseInt(s.dataset.paso, 10);
        s.classList.toggle('activo', n === destino);
        s.classList.toggle('listo', n < destino);
    });

    document.getElementById('btn-paso-atras').style.display = destino > 1 ? 'inline-block' : 'none';
    document.getElementById('btn-paso-siguiente').style.display = destino < TOTAL_PASOS ? 'inline-block' : 'none';
    document.getElementById('btn-guardar').style.display = destino === TOTAL_PASOS ? 'inline-block' : 'none';
    document.getElementById('req-paso-ayuda').textContent = AYUDA_PASO[destino] || '';

    const cuerpo = document.querySelector('#modalCrearRequerimiento .modal-body');
    if (cuerpo) cuerpo.scrollTop = 0;
}

function avisarCampo(id, mensaje) {
    const campo = document.getElementById(id);
    if (campo) {
        campo.classList.add('is-invalid');
        campo.focus();
        campo.addEventListener('input', () => campo.classList.remove('is-invalid'), { once: true });
    }
    Swal.fire({ icon: 'warning', title: 'Falta un dato', text: mensaje, confirmButtonColor: '#405189' });
    return false;
}

function validarPaso(paso) {
    if (paso === 1) {
        if (!tipoSeleccionado) {
            document.getElementById('tipo-error').style.display = 'block';
            return false;
        }
        return true;
    }
    if (paso === 2) {
        if (!document.getElementById('sku').value.trim()) {
            return avisarCampo('sku', 'Indique el SKU del producto reclamado.');
        }
        if (!document.getElementById('nombre_producto').value.trim()) {
            return avisarCampo('nombre_producto', 'Indique el nombre del producto.');
        }
        return true;
    }
    if (paso === 3) {
        const esCliente = document.getElementById('origen').value === 'CLIENTE';
        if (esCliente && !document.getElementById('cliente_nombre').value.trim()) {
            return avisarCampo('cliente_nombre',
                'Indique el nombre del cliente. Si el producto se detectó en tienda, cambie el origen en el paso 1.');
        }
        if (!document.getElementById('motivo').value.trim()) {
            return avisarCampo('motivo', 'Describa brevemente el motivo del requerimiento.');
        }
        return true;
    }
    return true;
}

// ========== SELECCION DE TIPO ==========

function seleccionarTipo(card) {
    const tipo = card.dataset.tipo;
    tipoSeleccionado = tipo;
    document.getElementById('tipo').value = tipo;
    document.getElementById('tipo-error').style.display = 'none';

    // Highlight card seleccionada
    document.querySelectorAll('.tipo-card .tipo-card-inner').forEach(c => c.classList.remove('selected'));
    card.querySelector('.tipo-card-inner').classList.add('selected');

    document.getElementById('bloque-origen').style.display = 'block';

    // Mostrar/ocultar secciones condicionales
    actualizarSeccionesCondicionales(tipo);

    // Cargar tipos de foto requeridos
    cargarTiposFoto(tipo);
}

function actualizarSeccionesCondicionales(tipo) {
    // Ocultar todas las secciones condicionales
    document.getElementById('seccion-defecto').style.display = 'none';
    document.getElementById('seccion-error-despacho').style.display = 'none';
    document.getElementById('seccion-garantia').style.display = 'none';

    // Limpiar campos de subtipo para evitar enviar datos del tipo anterior
    document.getElementById('subtipo_defecto').value = '';
    document.getElementById('subtipo_error').value = '';
    document.getElementById('producto_esperado').value = '';

    if (tipo === 'PRODUCTO_FALLADO') {
        document.getElementById('seccion-defecto').style.display = 'block';
        // Deshabilitar el name del subtipo de error para que no se envie
        document.getElementById('subtipo_error').removeAttribute('name');
        document.getElementById('subtipo_defecto').setAttribute('name', 'subtipo');
        document.getElementById('condicion_producto_garantia').removeAttribute('name');
        document.getElementById('condicion_producto').setAttribute('name', 'condicion_producto');
    } else if (tipo === 'ERROR_DESPACHO') {
        document.getElementById('seccion-error-despacho').style.display = 'block';
        document.getElementById('subtipo_defecto').removeAttribute('name');
        document.getElementById('subtipo_error').setAttribute('name', 'subtipo');
    } else if (tipo === 'GARANTIA') {
        document.getElementById('seccion-garantia').style.display = 'block';
        document.getElementById('condicion_producto').removeAttribute('name');
        document.getElementById('condicion_producto_garantia').setAttribute('name', 'condicion_producto');
    }
}

// ========== ORIGEN (con o sin cliente) ==========

function cambiarOrigen(origen) {
    document.getElementById('origen').value = origen;
    const esStock = origen === 'STOCK';

    document.getElementById('badge-cliente-opcional').style.display = esStock ? 'inline-block' : 'none';
    document.getElementById('aviso-cliente-stock').style.display = esStock ? 'block' : 'none';
    document.getElementById('cliente-obligatorio').style.display = esStock ? 'none' : 'inline';
}

// ========== FOTOS GUIADAS ==========

function cargarTiposFoto(tipo) {
    fetch(`/app/api/requerimientos/tipos-foto/?tipo=${encodeURIComponent(tipo)}`)
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                tiposFotoActuales = data.tipos_foto;
                maxFotos = data.max_fotos;
                document.getElementById('badge-max-fotos').textContent = `Max: ${maxFotos}`;
                renderizarSlotsFoto(data.tipos_foto);

                // Mostrar guia de fotos para tipos que requieren evidencia
                const tiposConGuia = ['PRODUCTO_FALLADO', 'GARANTIA', 'ERROR_DESPACHO'];
                document.getElementById('guia-fotos').style.display =
                    tiposConGuia.includes(tipo) ? 'block' : 'none';

                // Mostrar/ocultar checklist
                const obligatorias = data.tipos_foto.filter(t => t.es_obligatorio);
                if (obligatorias.length > 0) {
                    document.getElementById('checklist-fotos').style.display = 'block';
                    actualizarChecklistFotos();
                } else {
                    document.getElementById('checklist-fotos').style.display = 'none';
                }
            }
        })
        .catch(err => console.error('Error cargando tipos de foto:', err));
}

function renderizarSlotsFoto(tiposFoto) {
    const container = document.getElementById('fotos-slots-container');
    container.innerHTML = '';
    contadorFotosAdicionales = 0;

    // Filtrar FOTO_ADICIONAL (se maneja por separado)
    const slots = tiposFoto.filter(tf => tf.codigo !== 'FOTO_ADICIONAL');

    slots.forEach((tf, idx) => {
        const col = document.createElement('div');
        col.className = 'col-6 col-lg-4';
        col.id = `slot-${tf.codigo}`;
        // La guía completa va en el tooltip, no impresa bajo cada tarjeta:
        // seis párrafos de instrucciones convertían la sección en un muro de
        // texto y tapaban lo único accionable, que es el botón de la foto.
        col.innerHTML = `
            <div class="foto-slot-card text-center p-2" id="slotcard-${tf.codigo}" title="${tf.descripcion_guia}">
                <div id="placeholder-${tf.codigo}">
                    <i class="${tf.icono} text-muted" style="font-size:1.6rem"></i>
                </div>
                <div id="preview-slot-${tf.codigo}" style="display:none;">
                    <img class="img-fluid rounded" style="max-height:96px;object-fit:cover;width:100%" id="img-slot-${tf.codigo}">
                </div>
                <div class="fw-semibold mt-1 d-flex align-items-center justify-content-center gap-1" style="font-size:.72rem;line-height:1.15">
                    <span>${tf.nombre}</span>
                    ${tf.es_obligatorio ? '<span class="badge bg-danger" style="font-size:.5rem">REQ</span>' : ''}
                    <i class="ri-question-line text-muted" style="font-size:.75rem" title="${tf.descripcion_guia}"></i>
                </div>
                <input type="file" class="form-control form-control-sm mt-1" id="input-${tf.codigo}" name="foto_${tf.codigo}" accept="image/*" capture="environment" onchange="previsualizarFotoSlot(this,'${tf.codigo}')" style="font-size:.7rem">
                <button type="button" class="btn btn-sm btn-outline-danger mt-1 w-100 py-0" style="display:none;font-size:.7rem" id="btn-quitar-${tf.codigo}" onclick="limpiarFotoSlot('${tf.codigo}')"><i class="ri-close-line"></i> Quitar</button>
            </div>
        `;
        container.appendChild(col);
    });

    // Limpiar fotos adicionales
    document.getElementById('fotos-adicionales-container').innerHTML = '';
    document.getElementById('btn-agregar-foto-adicional').style.display = 'inline-block';
}

function previsualizarFotoSlot(input, codigo) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById(`placeholder-${codigo}`).style.display = 'none';
            document.getElementById(`preview-slot-${codigo}`).style.display = 'block';
            document.getElementById(`img-slot-${codigo}`).src = e.target.result;
            document.getElementById(`btn-quitar-${codigo}`).style.display = 'block';
            document.getElementById(`slotcard-${codigo}`).classList.add('has-foto');
        };
        reader.readAsDataURL(input.files[0]);
        actualizarChecklistFotos();
    }
}

function limpiarFotoSlot(codigo) {
    document.getElementById(`input-${codigo}`).value = '';
    document.getElementById(`placeholder-${codigo}`).style.display = 'block';
    document.getElementById(`preview-slot-${codigo}`).style.display = 'none';
    document.getElementById(`btn-quitar-${codigo}`).style.display = 'none';
    document.getElementById(`slotcard-${codigo}`).classList.remove('has-foto');
    actualizarChecklistFotos();
}

function actualizarChecklistFotos() {
    const list = document.getElementById('checklist-fotos-list');
    list.innerHTML = '';
    const obligatorias = tiposFotoActuales.filter(t => t.es_obligatorio && t.codigo !== 'FOTO_ADICIONAL');
    obligatorias.forEach(tf => {
        const input = document.getElementById(`input-${tf.codigo}`);
        const tiene = input && input.files && input.files.length > 0;
        list.innerHTML += `
            <li class="list-group-item d-flex align-items-center py-2 px-3">
                <i class="${tiene ? 'ri-checkbox-circle-fill text-success' : 'ri-checkbox-blank-circle-line text-muted'} me-2 fs-5"></i>
                <span class="small ${tiene ? '' : 'text-muted'}">${tf.nombre}</span>
            </li>
        `;
    });
}

// Cuenta las fotos realmente seleccionadas: slots guiados con archivo + adicionales
function contarFotosSeleccionadas() {
    const slotsConFoto = Array.from(document.querySelectorAll('#fotos-slots-container input[type="file"]'))
        .filter(i => i.files && i.files.length > 0).length;
    const adicionales = Array.from(document.querySelectorAll('.foto-adicional-item input[type="file"]'))
        .filter(i => i.files && i.files.length > 0).length;
    return slotsConFoto + adicionales;
}

// Fotos adicionales
function agregarFotoAdicional() {
    const totalFotos = contarFotosSeleccionadas() +
        Array.from(document.querySelectorAll('.foto-adicional-item input[type="file"]'))
            .filter(i => !i.files || i.files.length === 0).length; // filas vacías ya agregadas
    if (totalFotos >= maxFotos) {
        Swal.fire('Limite alcanzado', `Solo puede agregar hasta ${maxFotos} fotos en total`, 'warning');
        return;
    }

    contadorFotosAdicionales++;
    const container = document.getElementById('fotos-adicionales-container');
    const div = document.createElement('div');
    div.className = 'row g-2 mb-2 foto-adicional-item';
    div.id = `foto-adicional-${contadorFotosAdicionales}`;
    div.innerHTML = `
        <div class="col-md-5">
            <input type="file" class="form-control form-control-sm" name="foto_adicional_${contadorFotosAdicionales}"
                   accept="image/*">
        </div>
        <div class="col-md-5">
            <input type="text" class="form-control form-control-sm" name="descripcion_foto_adicional_${contadorFotosAdicionales}"
                   placeholder="Descripcion (opcional)">
        </div>
        <div class="col-md-2">
            <button type="button" class="btn btn-sm btn-soft-danger w-100"
                    onclick="document.getElementById('foto-adicional-${contadorFotosAdicionales}').remove()">
                <i class="ri-delete-bin-line"></i>
            </button>
        </div>
    `;
    container.appendChild(div);
}

function validarFotosObligatorias() {
    const obligatorias = tiposFotoActuales.filter(t => t.es_obligatorio && t.codigo !== 'FOTO_ADICIONAL');
    const faltantes = [];
    for (const tf of obligatorias) {
        const input = document.getElementById(`input-${tf.codigo}`);
        if (!input || !input.files || input.files.length === 0) {
            faltantes.push(tf.nombre);
        }
    }
    return faltantes;
}

// ========== BUSQUEDA DE DOCUMENTO (todas las sucursales) ==========
let documentosEncontrados = []; // lista cuando hay multiples

function buscarDocumento() {
    const folio = document.getElementById('buscar_folio').value.trim();
    if (!folio) {
        Swal.fire('Atencion', 'Ingrese un folio o correlativo', 'warning');
        return;
    }

    Swal.fire({
        title: 'Buscando...',
        text: 'Buscando en todas las sucursales',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
    });

    fetch(`/app/api/requerimientos/buscar-ticket/?folio=${encodeURIComponent(folio)}`)
        .then(r => r.json())
        .then(data => {
            Swal.close();
            if (!data.success) {
                Swal.fire('No encontrado', data.error || 'Documento no encontrado', 'warning');
                return;
            }

            if (data.multiple) {
                // Multiples documentos: mostrar selector
                documentosEncontrados = data.documentos;
                mostrarSelectorDocumentos(data.documentos);
            } else {
                // Resultado unico
                documentosEncontrados = [data.documento];
                cargarDocumento(data.documento);
            }
        })
        .catch(error => {
            Swal.close();
            console.error('Error:', error);
            Swal.fire('Error', 'Error al buscar documento', 'error');
        });
}

function mostrarSelectorDocumentos(docs) {
    const sel = document.getElementById('documento_select');
    sel.innerHTML = '<option value="">-- Seleccione documento --</option>';
    docs.forEach((doc, i) => {
        const total = parseInt(doc.total).toLocaleString();
        sel.innerHTML += `<option value="${i}">[${doc.sucursal}] ${doc.tipo_dte} N°${doc.folio_dte || doc.correlativo} - ${doc.fecha} - $${total} (${doc.productos.length} prod.)</option>`;
    });
    document.getElementById('selector-documento').style.display = 'block';
    Swal.fire({
        icon: 'info',
        title: `${docs.length} documentos encontrados`,
        text: 'Seleccione el documento correcto de la lista',
        timer: 2500,
        showConfirmButton: false
    });
}

function seleccionarDocumento() {
    const idx = document.getElementById('documento_select').value;
    if (idx === '' || !documentosEncontrados[idx]) return;
    cargarDocumento(documentosEncontrados[idx]);
}

function cargarDocumento(doc) {
    documentoEncontrado = doc;
    productosDocumento = doc.productos;

    // Mostrar info
    document.getElementById('doc-info-text').innerHTML =
        `<strong>${doc.tipo_dte}</strong> N°${doc.folio_dte || doc.correlativo} — ${doc.fecha} — $${parseInt(doc.total).toLocaleString()} ` +
        `<span class="badge bg-info ms-1" style="font-size:.65rem"><i class="ri-store-2-line me-1"></i>${doc.sucursal}</span>`;
    document.getElementById('doc-productos-info').textContent = `${doc.productos.length} producto(s)`;
    document.getElementById('info-documento').style.display = 'block';

    // El tipo de documento se muestra en un <select> de opciones fijas: si el
    // DTE trae una glosa distinta se agrega al vuelo, o la selección quedaría
    // vacía y se perdería el dato al guardar.
    const selTipoDoc = document.getElementById('tipo_documento_visible');
    if (doc.tipo_dte && !Array.from(selTipoDoc.options).some(o => o.value === doc.tipo_dte)) {
        selTipoDoc.add(new Option(doc.tipo_dte, doc.tipo_dte));
    }
    selTipoDoc.value = doc.tipo_dte || '';
    document.getElementById('tipo_documento').value = doc.tipo_dte || '';
    document.getElementById('numero_boleta').value = doc.folio_dte || doc.correlativo;
    document.getElementById('fecha_compra').value = doc.fecha;

    // Auto-rellenar cliente
    if (doc.cliente_nombre) {
        document.getElementById('cliente_nombre').value = doc.cliente_nombre;
        document.getElementById('cliente_rut').value = doc.cliente_rut || '';
        document.getElementById('cliente_email').value = doc.cliente_email || '';
        document.getElementById('cliente_telefono').value = doc.cliente_telefono || '';
    }

    // Mostrar productos del documento para seleccion
    if (doc.productos.length > 0) {
        const sel = document.getElementById('producto_documento_select');
        sel.innerHTML = '<option value="">-- Seleccione producto --</option>';
        doc.productos.forEach((prod, i) => {
            const talla = prod.talla ? ` (${prod.talla})` : '';
            sel.innerHTML += `<option value="${i}">${prod.sku}${talla} — ${prod.nombre} (x${prod.cantidad})</option>`;
        });
        document.getElementById('seccion-producto-documento').style.display = 'block';
        document.getElementById('entrada-manual-producto').style.display = 'none';
        document.getElementById('toggle_manual').checked = false;

        // Si solo hay 1 producto, seleccionarlo automaticamente
        if (doc.productos.length === 1) {
            sel.value = '0';
            seleccionarProductoDocumento();
        }
    }
}

function seleccionarProductoDocumento() {
    const idx = document.getElementById('producto_documento_select').value;
    if (idx !== '' && productosDocumento[idx]) {
        const prod = productosDocumento[idx];
        document.getElementById('sku').value = prod.sku;
        document.getElementById('nombre_producto').value = prod.nombre;
        if (prod.cantidad) document.getElementById('cantidad').value = prod.cantidad;
        sugerirProveedor(prod.sku);
    }
}

// ========== PROVEEDOR SUGERIDO POR SKU ==========
// La tienda no tiene por qué saber a qué proveedor se le compró: el dato está
// en la última factura de COMPRA del SKU, y de paso trae el respaldo que el
// proveedor va a exigir.
function sugerirProveedor(sku) {
    if (!sku) return;
    const aviso = document.getElementById('aviso-proveedor-sugerido');

    fetch(`/app/api/requerimientos/sugerir-proveedor/?sku=${encodeURIComponent(sku)}`)
        .then(r => r.json())
        .then(data => {
            if (!data.success) { aviso.style.display = 'none'; return; }

            const select = document.getElementById('proveedor_id');
            // Solo autocompleta si el usuario no eligió proveedor a mano.
            if (!select.value) {
                select.value = data.proveedor.id;
                if (window.jQuery && jQuery(select).data('select2')) {
                    jQuery(select).trigger('change');
                }
            }
            if (!document.getElementById('numero_factura_compra').value) {
                document.getElementById('numero_factura_compra').value = data.compra.numero_documento || '';
                document.getElementById('fecha_factura_compra').value = data.compra.fecha_emision || '';
                document.getElementById('dte_compra_id').value = data.compra.dte_id || '';
            }
            aviso.innerHTML = `<i class="ri-lightbulb-flash-line me-1"></i>Detectado: ` +
                `<strong>${data.proveedor.nombre}</strong> — última compra ${data.compra.tipo_documento} ` +
                `N°${data.compra.numero_documento} del ${data.compra.fecha_emision}. ` +
                `<span class="text-muted">Lo confirma quien revise el requerimiento.</span>`;
            aviso.style.display = 'block';
        })
        .catch(() => { aviso.style.display = 'none'; });
}

function toggleManual() {
    const manual = document.getElementById('toggle_manual').checked;
    if (manual) {
        document.getElementById('entrada-manual-producto').style.display = 'block';
        document.getElementById('sku').value = '';
        document.getElementById('nombre_producto').value = '';
        document.getElementById('sku').setAttribute('required', 'required');
        document.getElementById('nombre_producto').setAttribute('required', 'required');
    } else {
        document.getElementById('entrada-manual-producto').style.display = 'none';
        // Re-seleccionar del documento si habia algo
        seleccionarProductoDocumento();
    }
}

function limpiarDocumento() {
    document.getElementById('buscar_folio').value = '';
    document.getElementById('info-documento').style.display = 'none';
    document.getElementById('selector-documento').style.display = 'none';
    document.getElementById('seccion-producto-documento').style.display = 'none';
    document.getElementById('entrada-manual-producto').style.display = 'block';
    document.getElementById('tipo_documento').value = '';
    document.getElementById('tipo_documento_visible').value = '';
    document.getElementById('numero_boleta').value = '';
    document.getElementById('fecha_compra').value = '';
    document.getElementById('sku').value = '';
    document.getElementById('nombre_producto').value = '';
    document.getElementById('cantidad').value = '1';
    document.getElementById('numero_factura_compra').value = '';
    document.getElementById('fecha_factura_compra').value = '';
    document.getElementById('dte_compra_id').value = '';
    document.getElementById('aviso-proveedor-sugerido').style.display = 'none';
    documentoEncontrado = null;
    productosDocumento = [];
    documentosEncontrados = [];
}

// ========== BUSQUEDA DE CLIENTE ==========
function buscarClientePorRUT() {
    const rut = document.getElementById('cliente_rut').value.trim();
    if (!rut) {
        Swal.fire('Atencion', 'Ingrese un RUT para buscar', 'warning');
        return;
    }

    fetch(`/app/api/requerimientos/buscar-cliente/?rut=${encodeURIComponent(rut)}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('cliente_nombre').value = data.cliente.nombre;
                document.getElementById('cliente_email').value = data.cliente.email || '';
                document.getElementById('cliente_telefono').value = data.cliente.telefono || '';
                Swal.fire('Exito', 'Cliente encontrado', 'success');
            } else {
                Swal.fire({
                    icon: 'info',
                    title: 'Cliente no encontrado',
                    text: 'No existe un cliente con ese RUT. Puede continuar ingresando los datos manualmente.',
                    confirmButtonText: 'Entendido'
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            Swal.fire('Error', 'Error al buscar cliente', 'error');
        });
}

// ========== BUSQUEDA DE PRODUCTO ==========
function buscarProducto() {
    const sku = document.getElementById('sku').value.trim();
    if (!sku) {
        Swal.fire('Atencion', 'Ingrese un SKU para buscar', 'warning');
        return;
    }

    fetch(`/app/api/requerimientos/buscar-producto/?sku=${encodeURIComponent(sku)}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('nombre_producto').value = data.producto.nombre;
                sugerirProveedor(sku);
                Swal.fire('Exito', 'Producto encontrado', 'success');
            } else {
                Swal.fire({
                    icon: 'warning',
                    title: 'Producto no encontrado',
                    text: 'El SKU no existe en el sistema. Puede continuar ingresando el nombre manualmente.',
                    confirmButtonText: 'Entendido'
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            Swal.fire('Error', 'Error al buscar producto', 'error');
        });
}

// ========== ENVIAR FORMULARIO ==========
document.getElementById('form-requerimiento').addEventListener('submit', function(e) {
    e.preventDefault();
    intentarCrear();
});

function intentarCrear() {
    // Se revalidan TODOS los pasos: el usuario pudo volver atrás y vaciar algo.
    for (let paso = 1; paso <= TOTAL_PASOS; paso++) {
        if (!validarPaso(paso)) {
            if (paso !== pasoActual) irAPaso(paso);
            return;
        }
    }

    // Validar límite total de fotos (el backend también lo aplica)
    if (contarFotosSeleccionadas() > maxFotos) {
        Swal.fire('Demasiadas fotos', `El máximo para este tipo de requerimiento es ${maxFotos} foto(s). Quite algunas antes de continuar.`, 'warning');
        return;
    }

    // Validar fotos obligatorias (advertencia, no bloqueo)
    const faltantes = validarFotosObligatorias();
    if (faltantes.length > 0) {
        Swal.fire({
            icon: 'warning',
            title: 'Fotos obligatorias faltantes',
            html: `<p>Las siguientes fotos obligatorias no han sido adjuntadas:</p>
                   <ul class="text-start">${faltantes.map(f => `<li>${f}</li>`).join('')}</ul>
                   <p class="text-muted small">Puede crear el requerimiento sin ellas, pero seran necesarias para enviarlo al proveedor.</p>`,
            showCancelButton: true,
            confirmButtonText: 'Crear de todas formas',
            cancelButtonText: 'Volver y adjuntar',
            confirmButtonColor: '#f0ad4e',
        }).then((result) => {
            if (result.isConfirmed) {
                enviarFormulario();
            }
        });
        return;
    }

    enviarFormulario();
}

function restaurarBotonGuardar(btn) {
    btn.disabled = false;
    btn.innerHTML = '<i class="ri-check-line me-1"></i>Crear requerimiento';
}

function enviarFormulario() {
    const form = document.getElementById('form-requerimiento');
    const formData = new FormData(form);
    const btnGuardar = document.getElementById('btn-guardar');

    btnGuardar.disabled = true;
    btnGuardar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creando...';

    fetch('/app/api/requerimientos/crear/', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            Swal.fire({
                icon: 'success',
                title: 'Requerimiento creado!',
                text: `Numero de requerimiento: ${data.numero_requerimiento}`,
                confirmButtonText: 'Aceptar'
            }).then(() => {
                window.location.href = '/app/requerimientos/';
            });
        } else {
            Swal.fire('Error', data.error || 'No se pudo crear el requerimiento', 'error');
            restaurarBotonGuardar(btnGuardar);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        Swal.fire('Error', 'Error al crear el requerimiento', 'error');
        restaurarBotonGuardar(btnGuardar);
    });
}

// ========== VALIDACION DE RUT ==========
function validarRUTAutomatico() {
    const rut = document.getElementById('cliente_rut').value.trim();
    if (!rut) return;

    fetch(`/app/api/requerimientos/validar-rut/?rut=${encodeURIComponent(rut)}`)
        .then(response => response.json())
        .then(data => {
            if (data.success && data.valido) {
                document.getElementById('rut-validacion-msg').innerHTML =
                    '<span class="text-success"><i class="ri-checkbox-circle-line me-1"></i>RUT valido</span>';
                document.getElementById('cliente_rut').value = data.rut_formateado;
                document.getElementById('cliente_rut').classList.remove('is-invalid');
                document.getElementById('cliente_rut').classList.add('is-valid');
            } else {
                document.getElementById('rut-validacion-msg').innerHTML =
                    '<span class="text-danger"><i class="ri-close-circle-line me-1"></i>' + (data.message || 'RUT invalido') + '</span>';
                document.getElementById('cliente_rut').classList.remove('is-valid');
                document.getElementById('cliente_rut').classList.add('is-invalid');
            }
        })
        .catch(error => console.error('Error:', error));
}

}

// ========== GESTION DE CLIENTES ==========
function abrirModalCrearCliente() {
    const rut = document.getElementById('cliente_rut').value.trim();
    const nombre = document.getElementById('cliente_nombre').value.trim();

    if (rut) document.getElementById('modal-cliente-rut').value = rut;
    if (nombre) {
        const partes = nombre.split(' ');
        if (partes.length > 1) {
            document.getElementById('modal-cliente-nombre').value = partes[0];
            document.getElementById('modal-cliente-apellido').value = partes.slice(1).join(' ');
        } else {
            document.getElementById('modal-cliente-nombre').value = nombre;
        }
    }

    const modal = new bootstrap.Modal(document.getElementById('modalCrearCliente'));
    modal.show();
}

function guardarNuevoCliente() {
    const form = document.getElementById('form-crear-cliente');
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }

    const clienteData = {
        rut: document.getElementById('modal-cliente-rut').value.trim(),
        nombre: document.getElementById('modal-cliente-nombre').value.trim(),
        apellido: document.getElementById('modal-cliente-apellido').value.trim(),
        telefono: document.getElementById('modal-cliente-telefono').value.trim(),
        email: document.getElementById('modal-cliente-email').value.trim(),
        direccion: document.getElementById('modal-cliente-direccion').value.trim(),
        comuna: document.getElementById('modal-cliente-comuna').value.trim(),
        ciudad: document.getElementById('modal-cliente-ciudad').value.trim(),
    };

    fetch('/app/api/requerimientos/crear-cliente/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(clienteData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('cliente_nombre').value = data.cliente.nombre;
            document.getElementById('cliente_rut').value = data.cliente.rut;
            document.getElementById('cliente_email').value = data.cliente.email;
            document.getElementById('cliente_telefono').value = data.cliente.telefono;

            const modal = bootstrap.Modal.getInstance(document.getElementById('modalCrearCliente'));
            modal.hide();
            document.getElementById('form-crear-cliente').reset();
            Swal.fire('Exito', 'Cliente creado y datos completados', 'success');
        } else {
            Swal.fire('Error', data.error || 'No se pudo crear el cliente', 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        Swal.fire('Error', 'Error al crear cliente', 'error');
    });
}

document.addEventListener('DOMContentLoaded', function() {
    // Select2 lo carga el footer. `dropdownParent` es imprescindible dentro de
    // un modal: si no, el desplegable se dibuja detrás del backdrop y no se
    // puede escribir en el buscador.
    if (window.jQuery && jQuery.fn.select2) {
        const opciones = {
            theme: 'bootstrap-5',
            placeholder: 'Se detecta automáticamente',
            allowClear: true,
            language: {
                noResults: function() { return 'No se encontraron proveedores'; },
                searching: function() { return 'Buscando...'; }
            }
        };
        const modal = document.getElementById('modalCrearRequerimiento');
        if (modal) opciones.dropdownParent = jQuery(modal);
        jQuery('#proveedor_id').select2(opciones);
    }

    irAPaso(1);
});
