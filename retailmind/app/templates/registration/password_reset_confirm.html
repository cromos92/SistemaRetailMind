{% load static %}

<style>
@media (max-width: 576px) {
    .container { padding: 0.5rem; }
    .container h2 { font-size: 1.125rem; }
    .btn { width: 100%; min-height: 48px; }
    .container p { font-size: 0.9rem; }
}
</style>

{% block content %}
<div class="container">
    <h2>Restablecer Contraseña</h2>
    <p>Por favor, introduce tu nueva contraseña.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Cambiar mi contraseña</button>
    </form>
</div>
{% endblock %}
