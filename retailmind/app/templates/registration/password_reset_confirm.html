{% load static %}

{% block content %}
<div class="container">
    <h2>Restablecer Contraseña</h2>
    <p>Por favor, introduce tu nueva contraseña.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Cambiar mi contraseña</button>
    </form>
</div>
{% endblock %}
