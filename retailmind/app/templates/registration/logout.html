{% load static %}
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>NEXO - Sesión Cerrada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Sistema de Gestión Retail - NEXO" name="description" />

    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'css/icons.min.css' %}" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --nexo-primary: #0066FF;
            --nexo-primary-dark: #0052CC;
            --nexo-secondary: #1A1A2E;
            --nexo-accent: #00D4AA;
            --nexo-gray-100: #F5F5F7;
            --nexo-gray-300: #D1D1D9;
            --nexo-gray-500: #8A8A9A;
            --nexo-white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--nexo-secondary) 0%, #2D2D44 100%);
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.1) 0%, rgba(0, 212, 170, 0.1) 100%);
            animation: float 15s ease-in-out infinite;
        }

        .shape-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .shape-2 { width: 200px; height: 200px; bottom: 10%; right: -50px; animation-delay: -5s; }
        .shape-3 { width: 150px; height: 150px; bottom: 30%; left: 10%; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            33% { transform: translateY(-20px) rotate(120deg) scale(1.05); }
            66% { transform: translateY(10px) rotate(240deg) scale(0.95); }
        }

        .auth-card {
            background: var(--nexo-white);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
        }

        .icon-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.15) 0%, rgba(0, 212, 170, 0.05) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon-circle i {
            font-size: 3.5rem;
            color: var(--nexo-accent);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--nexo-secondary);
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--nexo-gray-500);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-primary-nexo {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--nexo-white);
            background: linear-gradient(135deg, var(--nexo-primary) 0%, var(--nexo-primary-dark) 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary-nexo:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 102, 255, 0.4);
            color: var(--nexo-white);
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--nexo-gray-500);
        }

        .footer-text a {
            color: var(--nexo-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .auth-wrapper { padding: 1rem; }
            .auth-card { margin: 0.5rem; border-radius: 12px; padding: 2rem 1.25rem; }
            h1 { font-size: 1.125rem; }
            .icon-circle { width: 90px; height: 90px; }
            .icon-circle i { font-size: 2.5rem; }
            .btn-primary-nexo { min-height: 48px; font-size: 1rem; }
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <div class="auth-card">
            <div class="logo-container">
                <img src="{% static 'images/nexo-icon.svg' %}" alt="NEXO">
            </div>

            <div class="icon-circle">
                <i class="ri-logout-circle-r-line"></i>
            </div>

            <h1>¡Hasta pronto!</h1>
            <p class="subtitle">
                Has cerrado sesión correctamente.<br>
                Gracias por usar <strong>NEXO</strong>.
            </p>

            <a href="{% url 'login' %}" class="btn-primary-nexo">
                <i class="ri-login-circle-line"></i>
                Iniciar Sesión Nuevamente
            </a>

            <p class="footer-text">
                © <span id="year"></span> NEXO · <a href="https://webappsolutions.cl" target="_blank">WebAppSolutions</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
