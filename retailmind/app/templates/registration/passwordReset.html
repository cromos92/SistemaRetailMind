{% load static %}
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>NEXO - Recuperar Contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Sistema de Gestión Retail - NEXO" name="description" />

    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'css/icons.min.css' %}" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --nexo-primary: #0066FF;
            --nexo-primary-dark: #0052CC;
            --nexo-primary-light: #E6F0FF;
            --nexo-secondary: #1A1A2E;
            --nexo-accent: #00D4AA;
            --nexo-warning: #FFB020;
            --nexo-gray-100: #F5F5F7;
            --nexo-gray-300: #D1D1D9;
            --nexo-gray-500: #8A8A9A;
            --nexo-gray-700: #4A4A5A;
            --nexo-white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--nexo-secondary) 0%, #2D2D44 100%);
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.1) 0%, rgba(0, 212, 170, 0.1) 100%);
            animation: float 15s ease-in-out infinite;
        }

        .shape-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .shape-2 { width: 200px; height: 200px; bottom: 10%; right: -50px; animation-delay: -5s; }
        .shape-3 { width: 150px; height: 150px; bottom: 30%; left: 10%; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            33% { transform: translateY(-20px) rotate(120deg) scale(1.05); }
            66% { transform: translateY(10px) rotate(240deg) scale(0.95); }
        }

        .auth-card {
            background: var(--nexo-white);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--nexo-primary-light) 0%, rgba(0, 102, 255, 0.1) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon-circle i {
            font-size: 2.5rem;
            color: var(--nexo-primary);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--nexo-secondary);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--nexo-gray-500);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .alert-info-nexo {
            background: rgba(255, 176, 32, 0.1);
            border: 1px solid rgba(255, 176, 32, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-info-nexo i {
            color: var(--nexo-warning);
            font-size: 1.25rem;
        }

        .alert-info-nexo span {
            color: #996B00;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--nexo-gray-700);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--nexo-gray-500);
            font-size: 1.125rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.875rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--nexo-secondary);
            background: var(--nexo-gray-100);
            border: 2px solid transparent;
            border-radius: 12px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder { color: var(--nexo-gray-500); }
        .form-input:hover { background: #e8e8ec; }
        .form-input:focus { 
            background: var(--nexo-white); 
            border-color: var(--nexo-primary); 
            box-shadow: 0 0 0 4px var(--nexo-primary-light); 
        }

        .btn-primary-nexo {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--nexo-white);
            background: linear-gradient(135deg, var(--nexo-primary) 0%, var(--nexo-primary-dark) 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary-nexo:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 102, 255, 0.4);
        }

        .btn-primary-nexo:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--nexo-gray-500);
        }

        .back-link a {
            color: var(--nexo-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--nexo-gray-500);
        }

        .footer-text a {
            color: var(--nexo-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--nexo-white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <div class="auth-card">
            <div class="logo-container">
                <img src="{% static 'images/nexo-icon.svg' %}" alt="NEXO">
            </div>

            <div class="icon-circle">
                <i class="ri-lock-unlock-line"></i>
            </div>

            <h1>¿Olvidaste tu contraseña?</h1>
            <p class="subtitle">Ingresa tu correo electrónico y te enviaremos instrucciones para recuperarla.</p>

            <div class="alert-info-nexo">
                <i class="ri-information-line"></i>
                <span>Se enviará una contraseña temporal a tu correo.</span>
            </div>

            <form id="formResetPassword" method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" 
                               class="form-input" 
                               id="email" 
                               name="email" 
                               placeholder="tu@correo.com" 
                               required 
                               autocomplete="email">
                        <i class="ri-mail-line input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary-nexo" id="btn-submit">
                    <span id="btn-text">Enviar Instrucciones</span>
                    <i class="ri-send-plane-line" id="btn-icon"></i>
                </button>
            </form>

            <p class="back-link">
                ¿Ya recordaste tu contraseña? <a href="{% url 'login' %}">Iniciar Sesión</a>
            </p>

            <p class="footer-text">
                © <span id="year"></span> NEXO · <a href="https://webappsolutions.cl" target="_blank">WebAppSolutions</a>
            </p>
        </div>
    </div>

    <script src="{% static 'js/jquery-3.5.1.min.js' %}"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        $('#formResetPassword').on('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            
            btn.disabled = true;
            btnText.textContent = 'Enviando...';
            btnIcon.outerHTML = '<div class="spinner"></div>';

            $.ajax({
                url: '{% url "verResetPassword" %}',
                type: 'POST',
                data: $(this).serialize(),
                beforeSend: function(xhr) {
                    xhr.setRequestHeader("X-CSRFToken", $('input[name="csrfmiddlewaretoken"]').val());
                },
                success: function(data) {
                    window.location.href = data.redirect_url;
                },
                error: function(response) {
                    btn.disabled = false;
                    btnText.textContent = 'Enviar Instrucciones';
                    document.querySelector('.spinner').outerHTML = '<i class="ri-send-plane-line" id="btn-icon"></i>';
                    alert('Error: ' + (response.responseJSON?.errors || 'No se pudo enviar el correo'));
                }
            });
        });
    </script>
</body>

</html>
