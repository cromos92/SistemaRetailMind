 {% load static %}
<!doctype html>
<html lang="es" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg" data-sidebar-image="none" data-preloader="disable"{% if pos_kiosk %} data-pos-kiosk="1"{% endif %}{% if pos_kiosk_strict %} data-pos-kiosk-strict="1"{% endif %}>

<head>

    <meta charset="utf-8" />
    <title>{% if pos_kiosk_strict %}NEXO POS{% else %}System | Webappsolutions - Plantilla de Administración y Panel de Control{% endif %}</title>
    {% if pos_kiosk_strict %}
    <meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    {% else %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% endif %}
    <meta content="Plantilla Premium de Administración y Panel de Control Multipropósito" name="description" />
    <meta content="Webappsolutions" name="Javier Araya" />
  
    <!-- Persistir preferencia de tema en localStorage (antes de layout.js) -->
    <script>
    (function(){
        var saved = localStorage.getItem('theme-preference');
        if (saved) {
            sessionStorage.setItem('data-layout-mode', saved);
            document.documentElement.setAttribute('data-layout-mode', saved);
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-topbar', 'dark');
                document.documentElement.setAttribute('data-sidebar', 'dark');
                sessionStorage.setItem('data-topbar', 'dark');
            } else {
                document.documentElement.setAttribute('data-topbar', 'light');
                sessionStorage.setItem('data-topbar', 'light');
            }
        }
    })();
    </script>
    <!-- Layout config Js -->
    <script src="{% static 'js/layout.js' %}"></script>
    <!-- Bootstrap Css -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="{% static 'css/icons.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- App Css-->
  
    <link href="{% static 'css/app.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'libs/dropzone/basic.css' %}" rel="stylesheet" type="text/css" />
 
    <!-- custom Css-->
    <link href="{% static 'css/custom.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- NEXO Design System + Responsive -->
    <link href="{% static 'css/nexo-design-system.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'css/nexo-responsive.css' %}" rel="stylesheet" type="text/css" />
    {% if pos_kiosk %}
    <!-- POS Kiosk overrides (targets 48-64px, fuentes 16-18px, sin :hover colgado) -->
    <link href="{% static 'css/pos-kiosk.css' %}" rel="stylesheet" type="text/css" />
    {% endif %}
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    <link href="{% static 'libs/sweetalert2/sweetalert2.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- jsvectormap css -->
    <link href="{% static 'libs/jsvectormap/css/jsvectormap.min.css' %}" rel="stylesheet" type="text/css" />
    <!--Swiper slider css-->
    <link href="{% static 'libs\flatpickr\flatpickr.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'libs/swiper/swiper-bundle.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <!--Swiper slider css-->
    <link href="{% static 'libs/dropzone/dropzone.css' %}" rel="stylesheet" type="text/css" />
 

</head>
