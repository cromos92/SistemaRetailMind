<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correlativos en rojo</title>
</head>
{% comment %}
Layout basado en tablas con estilos inline (mismo criterio que
emails/requerimiento_proveedor.html): los clientes de correo no soportan
flexbox ni <style> externo de forma fiable.

Un solo correo diario con TODOS los correlativos en rojo (agotados o con menos
de Correlativo.UMBRAL_CRITICO folios) en vez de uno por correlativo, para no
mandar N correos separados cuando varias sucursales/tipos de documento caen el
mismo día.
{% endcomment %}
<body style="margin:0;padding:0;background-color:#f4f5f8;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#333333;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
        {{ correlativos|length }} correlativo(s) sin folios o por agotarse — revisar antes de que falle una emisión
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f8;padding:20px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px;width:100%;background-color:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;">

                    <!-- ══════════ Cabecera ══════════ -->
                    <tr>
                        <td bgcolor="#FF4D4D" style="background-color:#FF4D4D;color:#ffffff;padding:22px 24px;">
                            <h1 style="margin:0;font-size:20px;font-weight:600;">⚠ Correlativos en rojo</h1>
                            <p style="margin:5px 0 0;font-size:14px;opacity:.92;">
                                {{ correlativos|length }} correlativo(s) agotado(s) o con menos de {{ umbral_critico }} folios disponibles
                            </p>
                        </td>
                    </tr>

                    <!-- ══════════ Detalle ══════════ -->
                    <tr>
                        <td style="padding:22px 24px 6px;">
                            <p style="margin:0 0 16px;font-size:14px;">
                                Revisión automática diaria de <strong>Gestión de Correlativos</strong>.
                                Los siguientes correlativos necesitan folios nuevos antes de que falle una emisión:
                            </p>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:13px;">
                                <tr style="background-color:#f7f9fd;">
                                    <td style="padding:8px 10px;border-bottom:2px solid #e5e7eb;font-weight:600;color:#4A4A5A;">Sucursal</td>
                                    <td style="padding:8px 10px;border-bottom:2px solid #e5e7eb;font-weight:600;color:#4A4A5A;">Tipo documento</td>
                                    <td style="padding:8px 10px;border-bottom:2px solid #e5e7eb;font-weight:600;color:#4A4A5A;text-align:right;">Disponibles</td>
                                    <td style="padding:8px 10px;border-bottom:2px solid #e5e7eb;font-weight:600;color:#4A4A5A;">Estado</td>
                                </tr>
                                {% for c in correlativos %}
                                <tr>
                                    <td style="padding:8px 10px;border-bottom:1px solid #eef0f4;">{{ c.sucursal_alias }}</td>
                                    <td style="padding:8px 10px;border-bottom:1px solid #eef0f4;">{{ c.tipo_dte }}</td>
                                    <td style="padding:8px 10px;border-bottom:1px solid #eef0f4;text-align:right;font-weight:700;color:{% if c.nivel_alerta == 'agotado' %}#c0392b{% else %}#FF4D4D{% endif %};">{{ c.disponibles }}</td>
                                    <td style="padding:8px 10px;border-bottom:1px solid #eef0f4;">
                                        {% if c.nivel_alerta == 'agotado' %}
                                            <span style="display:inline-block;background-color:#c0392b;color:#ffffff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;">Agotado</span>
                                        {% else %}
                                            <span style="display:inline-block;background-color:#FF4D4D;color:#ffffff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;">Crítico</span>
                                        {% endif %}
                                    </td>
                                </tr>
                                {% endfor %}
                            </table>
                        </td>
                    </tr>

                    {% if url_gestion %}
                    <!-- ══════════ Acción ══════════ -->
                    <tr>
                        <td style="padding:20px 24px 24px;" align="center">
                            <a href="{{ url_gestion }}" style="display:inline-block;background-color:#0066FF;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 28px;border-radius:8px;">
                                Abrir Gestión de Correlativos
                            </a>
                        </td>
                    </tr>
                    {% endif %}

                    <!-- ══════════ Pie ══════════ -->
                    <tr>
                        <td style="padding:16px 24px;background-color:#f7f9fd;border-top:1px solid #e5e7eb;">
                            <p style="margin:0;font-size:11px;color:#8A8A9A;">
                                Revisión automática diaria. Umbral: agotado = 0 folios, crítico = menos de {{ umbral_critico }}.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
