[phases.setup]
nixPkgs = ['python39', 'pip']
nixLibs = ['python39Packages.pip']

[phases.install]
cmds = [
    'cd retailmind',
    'pip install -r requirements.txt'
]

[phases.build]
cmds = [
    'cd retailmind',
    'python manage.py collectstatic --noinput'
]

[start]
cmd = 'cd retailmind && gunicorn retailmind.wsgi --log-file -'
